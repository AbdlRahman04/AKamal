<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11110f; color: #e7e3db; }
    body { max-width: 760px; margin: 0 auto; padding: 12vh 24px; }
    a { color: inherit; text-decoration: none; }
    .kicker { color: #d96831; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 620px; font-size: clamp(2.8rem, 8vw, 6rem); line-height: .95; font-weight: 500; letter-spacing: -.06em; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 48px; }
    .card { padding: 26px; border: 1px solid rgba(231,227,219,.22); border-radius: 4px; background: rgba(231,227,219,.05); transition: border-color .2s, transform .2s; }
    .card:hover { border-color: #d96831; transform: translateY(-3px); }
    .card strong { display: block; margin-bottom: 10px; font-size: 1.35rem; }
    .card span { color: rgba(231,227,219,.62); font-size: 13px; line-height: 1.5; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <p class="kicker">Local content workspace</p>
  <h1>Choose the section you want to shape.</h1>
  <div class="grid">
    <a class="card" href="/photography-admin"><strong>Photography</strong><span>Collections, photos, metadata, uploads, and AI suggestions.</span></a>
    <a class="card" href="/dev-admin"><strong>Dev</strong><span>Projects, profile identity, capabilities, and journey.</span></a>
  </div>
</body>
</html>
